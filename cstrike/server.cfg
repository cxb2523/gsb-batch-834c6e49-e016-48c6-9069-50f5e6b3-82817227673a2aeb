hostname "CS 1.6 LAN Party"
sv_lan 0
public 0
mp_friendlyfire 1
mp_timelimit 30
mp_autoteambalance 1

// --- full arsenal for everyone ---
// Max money every round so anyone can buy the whole arsenal in the buyzone.
mp_startmoney 16000
mp_buytime 9

// RCON — used by the map picker to changelevel. Two callers share this
// password, intentionally public on a LAN so anyone may switch the map:
//   1. the control service (control/server.py) sends `rcon changelevel` over
//      UDP and confirms the new level via A2S_INFO polling;
//   2. the browser picker (web/index.html) keeps an in-engine direct-RCON path
//      as a fallback if the control API is unreachable.
// Must stay in sync with RCON_PASSWORD in docker-compose.yml and RCON_PW in
// web/index.html. sv_lan must stay 0 — sv_lan 1 disables RCON entirely.
rcon_password "cs16lan"
