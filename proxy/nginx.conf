# Reverse proxy in front of the cs16-web container (P3, see docs/PERFORMANCE.md).
#
# Why: the upstream static server (inside the pinned image) serves valve.zip
# (~206 MB) and the content-hashed bundle with NO Cache-Control / ETag, so most
# browsers re-download the whole payload on every repeat visit / hard refresh.
# We can't edit that server, but docker-compose.yml is ours — so this proxy owns
# the public port 27016, forwards to the game container internally, and injects
# proper caching headers. The WebRTC media/data path (27018) is untouched; only
# the page + the same-origin signaling WebSocket (/websocket) flow through here.
#
# It also fronts the map-switch control service (control:8080) on same-origin
# /api/ paths, so every browser page can poll the live current map and trigger
# a deduped, confirmed changelevel without raw UDP access.

events {}

http {
    # Map the Upgrade header so the WebSocket upgrade is passed through verbatim.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # $valve_etag: a content fingerprint (hash of the zip bytes), regenerated by
    # start.sh / add-maps.sh whenever valve.zip is rebuilt. The wildcard include
    # means a missing/renamed file never prevents nginx from starting.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 27016;

        # Resolve the compose containers by name at request time (Docker
        # embedded DNS), so this proxy survives a container being recreated.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $game "cs16-web:27016";
        set $control "control:8080";

        # WebRTC signaling WebSocket — the make-or-break path. The client opens
        # ws(s)://<host>/websocket; the upgrade MUST pass through untouched or the
        # game never connects.
        location = /websocket {
            proxy_pass http://$game;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Map-switch control plane (control service). Same-origin so the page
        # needs no CORS, and no-store so a polled state can never be stale.
        location /api/ {
            proxy_pass http://$control;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        # Content-hashed bundle assets (JS / WASM / CSS / images): the filename
        # changes whenever the content changes, so they are safe to cache forever.
        # Covers the main-*.js bundle AND the multi-MB xash-*.wasm /
        # libref_webgl2-*.wasm modules and the hashed logo/favicon.
        location ~ "^/assets/.+-[A-Za-z0-9_-]{6,}\.(js|wasm|css|png)$" {
            proxy_pass http://$game;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # The big game payload. It is NOT content-hashed and its bytes change when
        # start.sh / add-maps.sh rebuild it. Caching follows the CONTENT, not the
        # file's timestamp:
        #   * $valve_etag is a hash of the zip's bytes (proxy/valve-etag.conf),
        #   * no-cache stores the body but forces a conditional GET every load,
        #   * an unchanged zip -> If-None-Match matches -> cheap 304,
        #   * a rebuilt zip -> new ETag -> conditional GET misses -> fresh 200.
        # The old scheme relied on the upstream Last-Modified, which stayed equal
        # across fast rebuilds and could keep serving a stale zip via 304. We hide
        # that header (and any upstream ETag) so only our content hash decides.
        # The ?v=<hash> query parameter added by sw.js is a second, belt-and-braces
        # fingerprint: nginx matches the path regardless of query string. Stream it
        # (buffering off) so nginx doesn't spool the whole file to disk.
        location = /valve.zip {
            proxy_pass http://$game;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            proxy_hide_header Last-Modified;
            proxy_hide_header ETag;

            if ($http_if_none_match = $valve_etag) {
                add_header ETag $valve_etag always;
                add_header Cache-Control "public, no-cache" always;
                return 304;
            }

            add_header ETag $valve_etag always;
            add_header Cache-Control "public, no-cache" always;
        }

        # index.html, sw.js and everything else: store but always revalidate, so
        # patched client changes (and the service worker itself) deploy promptly.
        # The only WebSocket path is /websocket (handled above), so no upgrade
        # headers here — this avoids forcing Connection: close on every request.
        location / {
            proxy_pass http://$game;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache" always;
        }
    }
}
