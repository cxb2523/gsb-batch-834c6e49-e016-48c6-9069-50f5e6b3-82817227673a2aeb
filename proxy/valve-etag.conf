# Default content fingerprint for valve.zip.
#
# Regenerated automatically — do not edit by hand. start.sh rewrites this file
# (and valve-versions.json) every time valve.zip is (re)built or a custom map is
# injected, using a SHA-256 hash of the zip's actual bytes, so a rebuild with an
# unchanged mtime still produces a new ETag and invalidates every browser cache.
# The value is RFC-7232 quoted (browsers echo it verbatim in If-None-Match).
# Mounted into the nginx container by docker-compose.yml; included via
# `include /etc/nginx/conf.d/*.conf;` in proxy/nginx.conf.
set $valve_etag "";
