name: cs16-web

services:
  cs16-web:
    # Pinned by digest: the patched web client (web/main.js, web/index.html)
    # references this image's hashed asset filenames. If you bump the image,
    # re-run ./prepare-client.sh to regenerate the patched client.
    image: yohimik/cs-web-server@sha256:ce01d36559ae78446baed1032252b87ee9ec639e4f2f2cdbbdcf75d75359a699
    container_name: cs16-web
    restart: unless-stopped
    platform: linux/386
    command: ["+map", "de_dust2", "+maxplayers", "16"]
    environment:
      PORT: 27018
      IP: 192.168.1.201
    volumes:
      - "./valve.zip:/xashds/public/valve.zip"
      # patched in-browser client: map picker + Esc fix + exposed engine handle
      - "./web/index.html:/xashds/public/index.html"
      - "./web/main.js:/xashds/public/assets/main-Sj92UznW.js"
      # server config: full-money arsenal + rcon for the map picker
      - "./cstrike/server.cfg:/xashds/cstrike/server.cfg"
      # custom maps (server side; clients get them from valve.zip)
      - "./custom-maps/cs_mansion.bsp:/xashds/cstrike/maps/cs_mansion.bsp"
    # 27016 (HTTP page + WebRTC signaling) is published by the proxy below, not
    # here — the proxy injects caching headers. WebRTC media stays direct on 27018.
    expose:
      - "27016"
    ports:
      - "27018:27018"
      - "27018:27018/udp"

  # Map-switch control plane: owns the same-origin /api/state and /api/map
  # endpoints the browser picker polls. Sends the RCON changelevel itself
  # (GoldSrc RCON over UDP), dedupes concurrent requests with an idempotency
  # key, and confirms the switch by polling the live map (A2S_INFO) so every
  # connected page learns the new map instead of guessing. See control/server.py.
  control:
    build: ./control
    container_name: cs16-control
    restart: unless-stopped
    depends_on:
      - cs16-web
    environment:
      GAME_HOST: cs16-web
      GAME_PORT: "27018"
      RCON_PASSWORD: cs16lan
      DEFAULT_MAP: de_dust2
    expose:
      - "8080"

  # Reverse proxy: owns public 27016, adds Cache-Control headers the in-image
  # server can't, routes the picker's /api calls to the control service, and
  # passes the /websocket signaling upgrade through. See proxy/nginx.conf +
  # docs/PERFORMANCE.md.
  proxy:
    image: nginx:1.29.1-alpine
    container_name: cs16-proxy
    restart: unless-stopped
    depends_on:
      - cs16-web
      - control
    ports:
      - "27016:27016"
    volumes:
      - "./proxy/nginx.conf:/etc/nginx/nginx.conf:ro"
      # Content fingerprint for valve.zip, regenerated by start.sh/add-maps.sh.
      # Included via a wildcard so a missing file can never break nginx startup.
      - "./proxy/valve-etag.conf:/etc/nginx/conf.d/valve-etag.conf:ro"
